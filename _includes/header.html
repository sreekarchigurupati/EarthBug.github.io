<header class="site-header" data-hide-on-scroll>
  <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
    <span class="st-label">{{ site.title | default: "Sreekar Chigurupati" | escape }}</span>
  </a>

  <nav class="site-nav">
    <input type="checkbox" id="nav-trigger" class="nav-trigger" />
    <label for="nav-trigger" aria-label="Toggle navigation menu"><span class="menu-icon" aria-hidden="true"></span></label>
    <div class="trigger">
      {% assign current = page.url %}
      {% for p in site.nav_pages %}
        <a class="page-link {% if current contains p.first[1] and p.first[1] != '' %}is-active{% endif %}" href="{{ p.first[1] | relative_url }}">{{ p.first[0] | capitalize }}</a>
      {% endfor %}
    </div>
  </nav>

  <div class="tb-clock"><span id="loc">Bloomington, IN</span> · <span id="clock">— : —</span></div>
</header>
